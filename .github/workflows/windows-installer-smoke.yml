name: LBL Concrete Designer installer smoke

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Draft GitHub release ID containing the installer asset
        required: true
        type: string
      asset_id:
        description: Exact draft installer asset ID
        required: true
        type: string
      version:
        description: Exact SemVer without the v prefix
        required: true
        type: string
      sha256:
        description: Expected uppercase SHA-256 of the installer
        required: true
        type: string

permissions:
  # Draft release assets are owner-only resources. The ephemeral GITHUB_TOKEN
  # needs Contents write to read and download the exact unpublished asset.
  contents: write

jobs:
  clean-install:
    name: Clean install on ${{ matrix.destination }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        destination:
          - c-default
          - d-custom
    steps:
      - name: Download and authenticate the exact draft asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ASSET_ID: ${{ inputs.asset_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECTED_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version input is not exact SemVer.' }
          if ($env:EXPECTED_SHA256 -notmatch '^[A-Fa-f0-9]{64}$') { throw 'SHA-256 input is invalid.' }
          if ($env:ASSET_ID -notmatch '^\d+$') { throw 'Draft asset ID is invalid.' }
          $apiHeaders = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'LBL-Concrete-Designer-Installer-Smoke'
          }
          $assetName = "LBL-Concrete-Designer-Setup-$env:EXPECTED_VERSION.exe"
          $asset = Invoke-RestMethod -Headers $apiHeaders -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$env:ASSET_ID"
          if ($asset.name -cne $assetName -or $asset.state -cne 'uploaded') { throw "Draft asset identity mismatch for $assetName." }
          $installerPath = Join-Path $env:RUNNER_TEMP $assetName
          $downloadHeaders = $apiHeaders.Clone()
          $downloadHeaders.Accept = 'application/octet-stream'
          Invoke-WebRequest -Headers $downloadHeaders -Uri "https://api.github.com/repos/${{ github.repository }}/releases/assets/$env:ASSET_ID" -OutFile $installerPath
          $actualHash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actualHash -cne $env:EXPECTED_SHA256.ToUpperInvariant()) { throw "Downloaded installer SHA-256 mismatch: $actualHash" }
          "INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install, launch, and uninstall
        shell: pwsh
        env:
          DESTINATION_KIND: ${{ matrix.destination }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-BoundedProcess {
            param(
              [Parameter(Mandatory = $true)][string]$FilePath,
              [string[]]$Arguments = @(),
              [string]$VerbatimArguments = '',
              [int]$TimeoutMilliseconds = 300000
            )
            $start = [Diagnostics.ProcessStartInfo]::new()
            $start.FileName = $FilePath
            $start.UseShellExecute = $false
            if (-not [String]::IsNullOrWhiteSpace($VerbatimArguments)) {
              $start.Arguments = $VerbatimArguments
            } else {
              foreach ($argument in $Arguments) { [void]$start.ArgumentList.Add($argument) }
            }
            $process = [Diagnostics.Process]::Start($start)
            if (-not $process.WaitForExit($TimeoutMilliseconds)) {
              try { $process.Kill($true) } catch { }
              throw "Process timed out: $FilePath"
            }
            if ($process.ExitCode -ne 0) { throw "Process exited with $($process.ExitCode): $FilePath" }
          }

          if ($env:DESTINATION_KIND -ceq 'c-default') {
            $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\LBL Concrete Designer'
            $installerArguments = @('/S')
            $installerVerbatimArguments = ''
          } elseif ($env:DESTINATION_KIND -ceq 'd-custom') {
            $installRoot = 'D:\LBL Apps\LBL Concrete Designer'
            $installerArguments = @()
            # NSIS requires /D= to be the final raw parameter with no quotes,
            # even when the absolute path contains spaces.
            $installerVerbatimArguments = "/S /D=$installRoot"
          } else {
            throw "Unknown destination matrix value: $env:DESTINATION_KIND"
          }

          if (Test-Path -LiteralPath $installRoot) { throw "Install root unexpectedly exists before QA: $installRoot" }
          Invoke-BoundedProcess -FilePath $env:INSTALLER_PATH -Arguments $installerArguments -VerbatimArguments $installerVerbatimArguments

          $namedUninstallEntries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -ceq 'LBL Concrete Designer' })
          Write-Host "Exact uninstall entries after install: $($namedUninstallEntries.Count)"
          foreach ($entry in $namedUninstallEntries) {
            Write-Host "InstallLocation='$([string]$entry.InstallLocation)' DisplayIcon='$([string]$entry.DisplayIcon)' UninstallString='$([string]$entry.UninstallString)'"
          }

          $applicationPath = Join-Path $installRoot 'LBL Concrete Designer.exe'
          if (-not (Test-Path -LiteralPath $applicationPath -PathType Leaf)) {
            $diagnosticRoots = @((Join-Path $env:LOCALAPPDATA 'Programs'), 'D:\LBL Apps') | Where-Object { Test-Path -LiteralPath $_ -PathType Container }
            $foundApplications = @($diagnosticRoots | ForEach-Object {
              Get-ChildItem -LiteralPath $_ -Filter 'LBL Concrete Designer.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            })
            Write-Host "Designer executables found under expected parent roots: $($foundApplications -join '; ')"
            throw "Installed application is missing: $applicationPath"
          }
          $application = Get-Item -LiteralPath $applicationPath
          if (-not $application.VersionInfo.ProductVersion.StartsWith($env:EXPECTED_VERSION, [StringComparison]::Ordinal)) {
            throw "Installed ProductVersion is $($application.VersionInfo.ProductVersion), expected $env:EXPECTED_VERSION."
          }

          if ($namedUninstallEntries.Count -ne 1) { throw "Expected one exact uninstall entry, found $($namedUninstallEntries.Count)." }
          $recordedInstallLocation = [string]$namedUninstallEntries[0].InstallLocation
          if (-not [String]::IsNullOrWhiteSpace($recordedInstallLocation) -and
            [IO.Path]::GetFullPath($recordedInstallLocation).TrimEnd('\') -ine [IO.Path]::GetFullPath($installRoot).TrimEnd('\')) {
            throw "Uninstall entry points to a different install root: $recordedInstallLocation"
          }

          $launch = [Diagnostics.ProcessStartInfo]::new()
          $launch.FileName = $applicationPath
          $launch.UseShellExecute = $false
          [void]$launch.ArgumentList.Add('--disable-gpu')
          $applicationProcess = [Diagnostics.Process]::Start($launch)
          Start-Sleep -Seconds 8
          if ($applicationProcess.HasExited -and $applicationProcess.ExitCode -ne 0) {
            throw "Installed application exited early with $($applicationProcess.ExitCode)."
          }
          $running = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and [IO.Path]::GetFullPath($_.ExecutablePath) -ieq [IO.Path]::GetFullPath($applicationPath) })
          if ($running.Count -lt 1) { throw 'No installed application process remained alive for the smoke interval.' }
          foreach ($entry in $running) { Stop-Process -Id $entry.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 2

          $uninstaller = @(Get-ChildItem -LiteralPath $installRoot -Filter 'Uninstall*.exe' -File)
          if ($uninstaller.Count -ne 1) { throw "Expected exactly one uninstaller, found $($uninstaller.Count)." }
          Invoke-BoundedProcess -FilePath $uninstaller[0].FullName -Arguments @('/S')
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          do {
            $remainingEntries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -ceq 'LBL Concrete Designer' })
            if (-not (Test-Path -LiteralPath $applicationPath) -and $remainingEntries.Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          } while ([DateTime]::UtcNow -lt $deadline)
          if (Test-Path -LiteralPath $applicationPath) { throw 'Application executable remains after silent uninstall.' }
          if ($remainingEntries.Count -ne 0) { throw 'Uninstall registry entry remains after silent uninstall.' }

          "Installer smoke passed for $env:DESTINATION_KIND at $installRoot" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
